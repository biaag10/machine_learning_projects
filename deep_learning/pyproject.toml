[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "module_deep_learning"
version = "0.0.1"
description = "Projeto de Deep Learning"
authors = [
  { name = "Bianca Andrade" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipykernel>=7.3.0",
    "loguru",
    "matplotlib>=3.11.2",
    "mkdocs",
    "pandas>=3.1.0",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
    "tqdm",
    "typer",
]
requires-python = "==3.12.10"


[tool.ruff]
line-length = 99
src = ["module_deep_learning"]
include = ["pyproject.toml", "module_deep_learning/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["module_deep_learning"]
force-sort-within-sections = true

